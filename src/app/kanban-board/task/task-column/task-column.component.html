<div [ngStyle]="{ 'background-color': color }" class="task_column">
  <h2 class="task_column__status">{{ formattedStatus() }}</h2>
  <div class="task_column__tasks">
    <app-task
      *ngFor="let task of displayedTasks"
      [task]="task"
      [columnStatus]="taskStatus()"
      (removedFromColumn)="removeFromColumn($event)"
      class="task_column__task"
    />
  </div>
</div>
