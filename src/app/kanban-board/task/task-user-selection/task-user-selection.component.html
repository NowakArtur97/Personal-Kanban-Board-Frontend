<div class="task_user_selection">
  <div class="task_user_selection__user">
    <p class="task_user_selection__username task_user_selection__username--big">
      Select tasks for user:
    </p>
  </div>
  <div
    (click)="findAllTasksAssignedToUser(ALL_TASKS_SELECTION)"
    class="task_user_selection__user task_user_selection__user--selectable"
  >
    <p
      [ngStyle]="{ color: colors()[users().length - 1] }"
      class="task_user_selection__username"
    >
      All users
    </p>
  </div>
  @for (user of users(); track $index) {
  <div
    (click)="findAllTasksAssignedToUser(user.userId)"
    class="task_user_selection__user task_user_selection__user--selectable"
  >
    <p
      [ngStyle]="{ color: colors()[$index] }"
      class="task_user_selection__username"
    >
      {{ user.username }}
    </p>
  </div>
  }
</div>
